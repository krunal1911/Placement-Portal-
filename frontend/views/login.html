<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | Placement Portal</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/login.css">
    <link rel="stylesheet" href="/responsive.css?v=103.0">
</head>
<body>

<div class="container">

    <div class="login-box">

        <div class="card-header-switch">
            <h1>Student Login</h1>
            <a href="/admin-login" class="switch-portal-btn">Admin Portal ⚙️</a>
        </div>

        <form id="loginForm">

            <div class="input-group">
                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter Email"
                    required>
            </div>

            <div class="input-group">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                    <label style="margin-bottom:0;">Password</label>
                    <button type="button" id="forgotPwdBtn" style="background:none;border:none;color:#2563eb;font-size:13px;font-weight:600;cursor:pointer;padding:0;font-family:inherit;">Forgot Password?</button>
                </div>
                <div style="position:relative;">
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter Password"
                        required
                        style="padding-right:44px;">
                    <button type="button" id="togglePwd" onclick="togglePasswordVisibility()" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:18px;color:#94a3b8;line-height:1;">👁️</button>
                </div>
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <p>
            Don't have an account?
            <a href="/register">Register</a>
        </p>

        <p>
            <a href="/">← Back to Home</a>
        </p>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
function togglePasswordVisibility() {
    const pwd = document.getElementById('password');
    const btn = document.getElementById('togglePwd');
    if (pwd.type === 'password') {
        pwd.type = 'text';
        btn.textContent = '🙈';
    } else {
        pwd.type = 'password';
        btn.textContent = '👁️';
    }
}

document.getElementById('forgotPwdBtn').addEventListener('click', async function() {
    const currentEmailVal = document.getElementById("email") ? document.getElementById("email").value.trim() : "";
    
    const { value: emailInput } = await Swal.fire({
        icon: 'question',
        title: '🔑 Forgot Password?',
        html: `
            <div style="text-align:left;font-size:14px;line-height:1.6;margin-bottom:12px;">
                Enter your registered email address to submit a password reset request directly to your Placement Admin:
            </div>
            <input id="swal-reset-email" class="swal2-input" placeholder="student@example.com" value="${currentEmailVal}" style="width:85%;font-size:15px;">
        `,
        showCancelButton: true,
        confirmButtonText: '📩 Submit Request to Admin',
        cancelButtonText: 'Cancel',
        confirmButtonColor: '#2563eb',
        preConfirm: () => {
            const val = document.getElementById("swal-reset-email").value.trim();
            if (!val || !val.includes("@")) {
                Swal.showValidationMessage("Please enter a valid email address.");
                return false;
            }
            return val;
        }
    });

    if (emailInput) {
        try {
            Swal.fire({ title: "Submitting Request...", allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            const response = await fetch("/api/request-password-reset", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: emailInput })
            });
            const data = await response.json();
            if (response.ok) {
                Swal.fire({
                    icon: 'success',
                    title: 'Request Sent! 📩',
                    html: `
                        <p style="font-size:14px;margin-bottom:10px;">${data.message}</p>
                        <p style="font-size:12px;color:#64748b;">Your Placement Admin will review your request and reset your password shortly.</p>
                    `,
                    confirmButtonColor: '#2563eb'
                });
            } else {
                Swal.fire("Request Failed", data.error || "Failed to submit request.", "error");
            }
        } catch (err) {
            console.error(err);
            Swal.fire("Error", "Server connection error while submitting request.", "error");
        }
    }
});

document.getElementById("loginForm").addEventListener("submit", async function(e){

    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    try{

        const response = await fetch("/login",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                email:email,
                password:password

            })

        });

        const message = await response.text();

        if(response.ok){
            const urlParams = new URLSearchParams(window.location.search);
            const redirectUrl = urlParams.get("redirect");
            if (redirectUrl) {
                window.location.href = redirectUrl;
            } else {
                window.location.href = "/dashboard";
            }
        }
        else{

            Swal.fire({

                icon:"error",
                title:"Login Failed",
                text:message,
                confirmButtonColor:"#2563eb"

            });

        }

    }
    catch(err){

        Swal.fire({

            icon:"error",
            title:"Server Error",
            text:"Unable to connect to server.",
            confirmButtonColor:"#2563eb"

        });

        console.log(err);

    }

});

</script>

    <script src="/responsive.js?v=103.0"></script>
</body>
</html>
