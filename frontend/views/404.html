<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Placement Portal</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
            position: relative;
        }

        /* Animated background blobs */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            animation: float 8s ease-in-out infinite;
        }
        .blob1 { width: 400px; height: 400px; background: rgba(99,102,241,0.2); top: -100px; left: -100px; }
        .blob2 { width: 300px; height: 300px; background: rgba(37,99,235,0.15); bottom: -80px; right: -80px; animation-delay: 3s; }
        @keyframes float { 0%,100%{transform:translate(0,0);} 50%{transform:translate(20px,-20px);} }

        .container {
            text-align: center;
            position: relative;
            z-index: 1;
            padding: 40px 24px;
            max-width: 560px;
        }

        .error-code {
            font-size: clamp(100px, 20vw, 160px);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -6px;
            background: linear-gradient(135deg, #6366f1, #2563eb, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            animation: pulse 3s ease-in-out infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.85;} }

        .rocket {
            font-size: 64px;
            display: block;
            margin-bottom: 24px;
            animation: rocketBounce 2s ease-in-out infinite alternate;
        }
        @keyframes rocketBounce { from{transform:translateY(0) rotate(-45deg);} to{transform:translateY(-12px) rotate(-45deg);} }

        h1 {
            font-size: clamp(22px, 5vw, 32px);
            font-weight: 800;
            margin-bottom: 12px;
            color: #f1f5f9;
        }

        p {
            font-size: 16px;
            color: rgba(255,255,255,0.6);
            line-height: 1.7;
            margin-bottom: 40px;
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-primary {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 14px 28px;
            background: linear-gradient(135deg, #2563eb, #6366f1);
            color: white; text-decoration: none; border-radius: 12px;
            font-weight: 700; font-size: 15px; transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(37,99,235,0.4);
        }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(37,99,235,0.5); }

        .btn-ghost {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 14px 28px;
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.8); text-decoration: none; border-radius: 12px;
            font-weight: 600; font-size: 15px; transition: all 0.3s;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .btn-ghost:hover { background: rgba(255,255,255,0.15); transform: translateY(-3px); }

        .nav-pills {
            display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
            margin-top: 40px; padding-top: 32px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .pill {
            padding: 8px 16px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 100px;
            font-size: 13px; color: rgba(255,255,255,0.55);
            text-decoration: none; transition: all 0.2s;
        }
        .pill:hover { background: rgba(255,255,255,0.12); color: white; }
    </style>
</head>
<body>
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>

    <div class="container">
        <span class="rocket">🚀</span>
        <div class="error-code">404</div>
        <h1>Houston, we have a problem!</h1>
        <p>The page you're looking for has either been moved, deleted, or never existed. Let's get you back on track.</p>

        <div class="actions">
            <a href="/" class="btn-primary">🏠 Back to Home</a>
            <a href="/dashboard" class="btn-ghost">📊 Go to Dashboard</a>
        </div>

        <div class="nav-pills">
            <a href="/login" class="pill">🔐 Login</a>
            <a href="/aptitude" class="pill">📝 Aptitude</a>
            <a href="/technical" class="pill">💻 Technical</a>
            <a href="/placement-drives" class="pill">🏢 Companies</a>
            <a href="/leaderboard" class="pill">🏆 Leaderboard</a>
        </div>
    </div>
</body>
</html>
