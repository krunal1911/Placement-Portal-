<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Placement Drives | Placement Portal</title>

    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/placement-drives.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/responsive.css?v=103.0">
</head>

<body>

<nav>

    <div class="logo">
        🚀 Placement Portal
    </div>

    <ul>

        <li><a href="/dashboard">Dashboard</a></li>
        <li><a href="/profile">Profile</a></li>
        <li><a href="/leaderboard">Leaderboard</a></li>
        <li><a href="/logout">Logout</a></li>

    </ul>

</nav>

<section class="hero">

    <h1>🏢 Placement Drives</h1>

    <p>
        Browse the latest companies visiting campus and apply with one click.
    </p>

</section>

<section class="search-section">

    <input
        type="text"
        id="search"
        placeholder="🔍 Search company or job role...">

</section>

<section id="companyContainer" class="company-grid">

</section>

<div class="back">

    <a href="/dashboard">
        ← Back to Dashboard
    </a>

</div>

<script>

async function loadCompanies(){
    try {
        const response = await fetch("/companies");
        const companies = await response.json();
        displayCompanies(companies);
    } catch (e) {
        console.error("Error loading placement drives:", e);
    }
}

function displayCompanies(companies){
    const container = document.getElementById("companyContainer");
    container.innerHTML = "";

    if (!companies || companies.length === 0) {
        container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px; font-size: 16px;">No placement drives found.</div>`;
        return;
    }

    companies.forEach(company => {
        const deadlineDate = company.deadline || company.lastDate || "Flexible";
        
        let isExpired = false;
        if (deadlineDate && deadlineDate.trim().toLowerCase() !== "flexible" && deadlineDate.trim().toLowerCase() !== "n/a") {
            const parsedDate = new Date(deadlineDate);
            if (!isNaN(parsedDate.getTime())) {
                parsedDate.setHours(23, 59, 59, 999);
                if (new Date() > parsedDate) {
                    isExpired = true;
                }
            }
        }

        const actionButton = isExpired 
            ? `<button disabled style="background:#94a3b8; width:100%; padding:12px; font-weight:700; cursor:not-allowed; border-radius:8px; color:#ffffff; border:none; opacity:0.85;">⏳ Application Closed</button>`
            : `<button onclick="applyCompany('${company._id}')" style="background:var(--primary); width:100%; padding:12px; font-weight:600; cursor:pointer; border-radius:8px; color:white; border:none;">Apply Now</button>`;

        let adminDeleteBtn = "";
        if (currentAdmin) {
            const adminComp = (currentAdmin.companyName || "").trim().toLowerCase();
            const driveComp = (company.companyName || "").trim().toLowerCase();
            if (currentAdmin.role === "superadmin" || (adminComp && adminComp === driveComp)) {
                adminDeleteBtn = `<button onclick="deleteCompanyDrive('${company._id}')" style="background:#fee2e2; color:#dc2626; border:1px solid #fecaca; width:100%; padding:10px; font-weight:700; cursor:pointer; border-radius:8px; margin-top:8px; font-size:13px; display:inline-flex; align-items:center; justify-content:center; gap:6px;">🗑️ Delete Placement Drive</button>`;
            }
        }

        const deadlineText = isExpired
            ? `<span style="color:#ef4444; font-weight:700;">📅 Deadline: ${deadlineDate} (Expired)</span>`
            : `<span>📅 Deadline: ${deadlineDate}</span>`;

        container.innerHTML += `
        <div class="company-card" style="${isExpired ? 'opacity:0.9;' : ''}">
            <div class="top">
                <div>
                    <h2>${company.companyName}</h2>
                    <span>${company.jobRole}</span>
                </div>
                <div class="salary">
                    ₹ ${company.package}
                </div>
            </div>
            <div class="details">
                <p>📍 ${company.location}</p>
                <p>🎓 Min CGPA: ${company.eligibility}</p>
                <p>${deadlineText}</p>
            </div>
            <div style="margin-top: 14px;">
                ${actionButton}
                ${adminDeleteBtn}
            </div>
        </div>
        `;
    });
}

let currentAdmin = null;
async function checkAdminStatus() {
    try {
        const res = await fetch("/current-admin", { cache: "no-store" });
        if (res.ok) {
            currentAdmin = await res.json();
        } else {
            currentAdmin = null;
        }
    } catch (e) {
        currentAdmin = null;
    }
}

async function deleteCompanyDrive(id) {
    const result = await Swal.fire({
        title: "Delete Placement Drive?",
        text: "Are you sure you want to delete this company drive? This action cannot be undone.",
        icon: "warning",
        showCancelButton: true,
        confirmButtonColor: "#ef4444",
        confirmButtonText: "Yes, Delete It!"
    });

    if (result.isConfirmed) {
        try {
            const res = await fetch(`/delete-company/${id}`, { method: "DELETE" });
            const data = await res.json();
            if (res.ok) {
                Swal.fire("Deleted!", data.message || "Company drive removed successfully.", "success")
                    .then(() => loadCompanies());
            } else {
                Swal.fire("Error", data.message || "Failed to delete company drive", "error");
            }
        } catch (e) {
            Swal.fire("Error", "Server error while deleting company drive.", "error");
        }
    }
}

async function applyCompany(id){
    const userRes = await fetch("/current-user");
    if (!userRes.ok) {
        Swal.fire({
            icon: "info",
            title: "Student Login Required",
            text: "Please log in as a student to apply for placement drives.",
            showCancelButton: true,
            confirmButtonText: "Login Now",
            cancelButtonText: "Cancel",
            confirmButtonColor: "#2563eb"
        }).then((result) => {
            if (result.isConfirmed) {
                window.location.href = "/login";
            }
        });
        return;
    }

    const response = await fetch("/apply-company",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body: JSON.stringify({
            companyId: id
        })
    });

    if (response.status === 401 || response.redirected) {
        Swal.fire({
            icon: "warning",
            title: "Student Session Expired",
            text: "Your session has expired. Please log in to complete your application.",
            showCancelButton: true,
            confirmButtonText: "Login Now",
            confirmButtonColor: "#2563eb"
        }).then((res) => {
            if (res.isConfirmed) window.location.href = "/login";
        });
        return;
    }

    const msg = await response.text();
    if (msg.includes("<!DOCTYPE") || msg.includes("<html")) {
        Swal.fire({
            icon: "warning",
            title: "Student Session Expired",
            text: "Please log in to complete your application.",
            showCancelButton: true,
            confirmButtonText: "Login Now",
            confirmButtonColor: "#2563eb"
        }).then((res) => {
            if (res.isConfirmed) window.location.href = "/login";
        });
        return;
    }

    Swal.fire({
        icon: response.ok ? "success" : "warning",
        title: response.ok ? "Application Saved!" : "Application Blocked",
        text: msg,
        confirmButtonColor: "#3b82f6"
    }).then(() => {
        if (response.ok) {
            window.location.href = "/my-applications";
        }
    });
}

document.getElementById("search").addEventListener("keyup",async function(){

    const text=this.value.toLowerCase();

    const response=await fetch("/companies");

    const companies=await response.json();

    const filtered=companies.filter(c=>

        c.companyName.toLowerCase().includes(text) ||

        c.jobRole.toLowerCase().includes(text)

    );

    displayCompanies(filtered);

});

async function checkUserSession() {
    const userRes = await fetch("/current-user");
    if (!userRes.ok) {
        document.body.innerHTML = '';
        Swal.fire({
            icon: "info",
            title: "Login Required",
            text: "Please login or register to view placement drives.",
            showCancelButton: true,
            confirmButtonText: "Login Now",
            cancelButtonText: "Go Back",
            confirmButtonColor: "#3b82f6"
        }).then((result) => {
            if (result.isConfirmed) {
                window.location.href = "/login";
            } else {
                window.location.href = "/";
            }
        });
    }
}
async function initDrivesPage() {
    await checkAdminStatus();
    await loadCompanies();
}
checkUserSession();
initDrivesPage();
setInterval(loadCompanies, 5000);
</script>

    <script src="/responsive.js?v=103.0"></script>
</body>
</html>
